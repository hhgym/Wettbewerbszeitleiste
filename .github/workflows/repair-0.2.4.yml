name: Repair and publish complete 0.2.4

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct missing source files and republish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/Admin assets/js
          cat bootstrap/Fields.* | base64 -d > src/Admin/Fields.php
          cat bootstrap/ImportExport.* | base64 -d > src/Admin/ImportExport.php
          cat bootstrap/Menu.* | base64 -d > src/Admin/Menu.php
          cat bootstrap/timeline-js.* | base64 -d > assets/js/timeline.js

          gh release delete v0.2.4 --cleanup-tag -y || true

          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/repair-0.2.4.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete 0.2.4 source"
          git push
