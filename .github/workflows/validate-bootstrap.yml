name: Validate bootstrap fragments

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/CHECK'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate reconstructed admin files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wz
          cat bootstrap/Fields.00 bootstrap/Fields.01 bootstrap/Fields.02 bootstrap/Fields.03 bootstrap/Fields.04 bootstrap/Fields.05 bootstrap/Fields.06 bootstrap/Fields.07 | base64 -d > /tmp/wz/Fields.php
          cat bootstrap/ImportExport.00 bootstrap/ImportExport.01 bootstrap/ImportExport.02 bootstrap/ImportExport.03 bootstrap/ImportExport.04 bootstrap/ImportExport.05 bootstrap/ImportExport.06 bootstrap/ImportExport.07 bootstrap/ImportExport.08 bootstrap/ImportExport.09 bootstrap/ImportExport.10 | base64 -d > /tmp/wz/ImportExport.php
          cat bootstrap/Menu.00 bootstrap/Menu.01 bootstrap/Menu.02 bootstrap/Menu.03 bootstrap/Menu.04 | base64 -d > /tmp/wz/Menu.php

          test "$(git hash-object /tmp/wz/Fields.php)" = "04253c4bf8f07d35b9f472c68dfd4cd9aa834801"
          test "$(git hash-object /tmp/wz/ImportExport.php)" = "45f6c49a2394bf157b48a952dc9ac880f97adcee"
          test "$(git hash-object /tmp/wz/Menu.php)" = "4a25d271606a0248fd6952ae9ec8ebb42d057e4a"

          echo "All admin fragments match the final 0.2.4 build."
