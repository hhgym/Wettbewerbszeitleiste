name: Finalize 0.2.4 release

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/FINALIZE'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary bootstrap state and rebuild release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release delete v0.2.4 --cleanup-tag -y || true

          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/repair-0.2.4.yml
          rm -f .github/workflows/validate-bootstrap.yml
          rm -f .github/workflows/finalize-0.2.4.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize complete 0.2.4 source"
          git push
