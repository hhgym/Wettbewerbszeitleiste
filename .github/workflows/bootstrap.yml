name: Bootstrap complete source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/part09'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source

          gh release delete v0.2.4 --cleanup-tag -y || true

          rsync -a --delete --exclude='.git/' /tmp/source/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Publish complete 0.2.4 source"
          git push
